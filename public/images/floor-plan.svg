<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" fill="none">
  <!-- Background -->
  <rect width="300" height="400" fill="#2D2520"/>

  <!-- Top wall with windows -->
  <rect x="0" y="0" width="300" height="30" fill="#8B4513"/>
  <rect x="50" y="5" width="40" height="20" fill="#4A6B8A" opacity="0.6"/>
  <rect x="100" y="5" width="40" height="20" fill="#4A6B8A" opacity="0.6"/>
  <rect x="150" y="5" width="40" height="20" fill="#4A6B8A" opacity="0.6"/>
  <rect x="200" y="5" width="40" height="20" fill="#4A6B8A" opacity="0.6"/>

  <!-- Projector screen area -->
  <rect x="100" y="35" width="100" height="10" fill="#1a1a1a"/>

  <!-- Central round table -->
  <circle cx="150" cy="120" r="30" fill="#C4A35A"/>
  <rect x="140" y="110" width="20" height="20" fill="#2D5A3D"/>

  <!-- L-shaped bar counter -->
  <path d="M 20 180 L 20 350 L 100 350 L 100 280 L 60 280 L 60 180 Z" fill="#5D3A1A"/>

  <!-- Tables in middle area -->
  <ellipse cx="200" cy="150" rx="25" ry="15" fill="#6B6B6B" opacity="0.5"/>
  <ellipse cx="220" cy="200" rx="25" ry="15" fill="#6B6B6B" opacity="0.5"/>

  <!-- Right side seating -->
  <rect x="250" y="180" width="40" height="80" fill="#C4A35A"/>

  <!-- Bottom area -->
  <rect x="120" y="340" width="80" height="30" fill="#C4A35A"/>
</svg>
